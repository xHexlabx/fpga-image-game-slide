project:
  title:        "Image Slide Puzzle"
  author:       "HexTex"
  discord:      ""
  description:  "A 4x4 sliding puzzle of a picture, drawn live from an image ROM with no framebuffer"
  language:     "Verilog"
  clock_hz:     25175000

  tiles: "1x1"

  top_module:  "tt_um_hextex_slidepuzzle"

  source_files:
    - "tt_um_hextex_slidepuzzle.v"
    - "puzzle_core.v"
    - "vga_timing.v"
    - "gamepad_pmod_rx.v"

pinout:
  ui[0]: "up"
  ui[1]: "down"
  ui[2]: "left"
  ui[3]: "right"
  ui[4]: "gamepad latch"
  ui[5]: "gamepad clock"
  ui[6]: "gamepad data"
  ui[7]: "start"

  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VSync"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "HSync"

  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
